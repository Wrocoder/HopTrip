name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: hoptrip_test
          POSTGRES_USER: hoptrip_test
          POSTGRES_PASSWORD: local-test-only
        ports: ["55432:5432"]
        options: --health-cmd "pg_isready -U hoptrip_test -d hoptrip_test" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://hoptrip_test:local-test-only@127.0.0.1:55432/hoptrip_test
      TEST_DATABASE_URL: postgresql+psycopg://hoptrip_test:local-test-only@127.0.0.1:55432/hoptrip_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: apps/web/package-lock.json}
      - run: pip install -r requirements.lock
      - run: pip install --no-deps -e .
      - run: python -m ruff check apps/api
      - run: python -m mypy
      - run: python -m alembic upgrade head
        working-directory: apps/api
      - run: python -m pytest -q
      - run: npm ci
        working-directory: apps/web
      - run: npm run lint && npm run typecheck && npm run build
        working-directory: apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run test:e2e
        working-directory: apps/web
      - name: Start production build for SEO audit
        run: docker compose -f docker-compose.rehearsal.yml up -d --build --wait
      - name: Audit production SEO
        run: |
          curl --fail --silent --show-error --retry 20 --retry-all-errors --retry-delay 2 --max-time 5 http://127.0.0.1:58080/info --output /dev/null
          npm run audit:seo -- http://127.0.0.1:58080 http://localhost:58080
        working-directory: apps/web
      - name: Audit accessibility and keyboard navigation
        run: npm run audit:experience -- http://127.0.0.1:58080 --accessibility-only
        working-directory: apps/web
      - name: Show rehearsal logs on failure
        if: failure()
        run: docker compose -f docker-compose.rehearsal.yml logs --no-color --tail 100
      - name: Stop SEO rehearsal
        if: always()
        run: docker compose -f docker-compose.rehearsal.yml down
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-failure-details
          path: apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 7
