name: checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: hoptrip_test
          POSTGRES_USER: hoptrip_test
          POSTGRES_PASSWORD: local-test-only
        ports: ["55432:5432"]
        options: --health-cmd "pg_isready -U hoptrip_test -d hoptrip_test" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://hoptrip_test:local-test-only@127.0.0.1:55432/hoptrip_test
      TEST_DATABASE_URL: postgresql+psycopg://hoptrip_test:local-test-only@127.0.0.1:55432/hoptrip_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: pip install -r requirements.lock
      - run: pip install --no-deps -e .
      - run: python -m ruff check apps/api
      - run: python -m mypy
      - run: python -m alembic upgrade head
        working-directory: apps/api
      - run: python -m pytest -q
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: apps/web/package-lock.json}
      - run: npm ci
        working-directory: apps/web
      # next build includes TypeScript checking; a separate typecheck duplicates it.
      - run: npm run test:unit && npm run lint && npm run build
        working-directory: apps/web
  checks:
    if: always()
    needs: [api, web]
    runs-on: ubuntu-latest
    steps:
      - name: Require both checks
        env:
          API_RESULT: ${{ needs.api.result }}
          WEB_RESULT: ${{ needs.web.result }}
        run: test "$API_RESULT" = success && test "$WEB_RESULT" = success
