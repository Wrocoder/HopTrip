name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: hoptrip_test
          POSTGRES_USER: hoptrip_test
          POSTGRES_PASSWORD: local-test-only
        ports: ["55432:5432"]
        options: --health-cmd "pg_isready -U hoptrip_test -d hoptrip_test" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://hoptrip_test:local-test-only@127.0.0.1:55432/hoptrip_test
      TEST_DATABASE_URL: postgresql+psycopg://hoptrip_test:local-test-only@127.0.0.1:55432/hoptrip_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: apps/web/package-lock.json}
      - run: pip install -r requirements.lock
      - run: pip install --no-deps -e .
      - run: python -m ruff check apps/api
      - run: python -m mypy
      - run: python -m alembic upgrade head
        working-directory: apps/api
      - run: python -m pytest -q
      - run: npm ci
        working-directory: apps/web
      - run: npm run lint && npm run typecheck && npm run build
        working-directory: apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run test:e2e
        working-directory: apps/web
