[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hoptrip-api"
version = "0.1.0"
description = "Travel deal discovery platform API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "uvicorn>=0.30,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "alembic>=1.14,<2.0",
  "pydantic-settings>=2.6,<3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "ruff>=0.8,<1.0",
  "mypy>=1.14,<3",
  "pip-tools>=7.4,<8",
]

[tool.hatch.build.targets.wheel]
packages = ["apps/api/app"]

[tool.ruff]
line-length = 100
target-version = "py312"
lint.ignore = ["B008", "FURB162"]
lint.select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
files = ["apps/api/app"]
check_untyped_defs = true
ignore_missing_imports = true


[tool.pytest.ini_options]
pythonpath = ["apps/api"]
testpaths = ["apps/api/tests"]
markers = ["postgres: requires an isolated PostgreSQL test database"]
