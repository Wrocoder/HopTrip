name: hoptrip-test
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hoptrip_test
      POSTGRES_PASSWORD: local-test-only
      POSTGRES_DB: hoptrip_test
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hoptrip_test -d hoptrip_test"]
      interval: 2s
      timeout: 3s
      retries: 20
