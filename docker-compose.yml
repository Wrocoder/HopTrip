services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hoptrip
      POSTGRES_USER: hoptrip
      POSTGRES_PASSWORD: hoptrip
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hoptrip -d hoptrip"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://hoptrip:hoptrip@db:5432/hoptrip
      ADMIN_TOKEN: change-me-in-development
      TRAVELPAYOUTS_API_TOKEN: ${TRAVELPAYOUTS_API_TOKEN:-}
      TRAVELPAYOUTS_API_BASE_URL: ${TRAVELPAYOUTS_API_BASE_URL:-https://api.travelpayouts.com}
      INGESTION_ORIGINS: ${INGESTION_ORIGINS:-WRO,WAW,WMI,KRK,GDN,KTW,POZ}
      AFFILIATE_ALLOWED_HOSTS: ${AFFILIATE_ALLOWED_HOSTS:-}
      PIPELINE_MAX_ATTEMPTS: ${PIPELINE_MAX_ATTEMPTS:-1}
      PIPELINE_RETRY_DELAY_SECONDS: ${PIPELINE_RETRY_DELAY_SECONDS:-5}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]

  web:
    build:
      context: apps/web
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      HOPTRIP_API_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
