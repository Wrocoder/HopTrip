# Optional local trust for HTTPS inspection; certificate is mounted only during install.
services:
  api: &api-build-ca
    build:
      secrets:
        - pip_ca
  migrate: *api-build-ca
  worker: *api-build-ca
  events-worker: *api-build-ca
  web:
    build:
      secrets:
        - npm_ca
secrets:
  pip_ca:
    file: ${HOPTRIP_BUILD_CA_FILE:?Set HOPTRIP_BUILD_CA_FILE to a trusted PEM CA certificate}
  npm_ca:
    file: ${HOPTRIP_BUILD_CA_FILE:?Set HOPTRIP_BUILD_CA_FILE to a trusted PEM CA certificate}
