# Apply after base + production; set HOPTRIP_DOMAIN=hoptrip.pl before building web.
# Public launch; operator details are mounted at runtime, outside the repository/image.
services:
  web:
    environment:
      HOPTRIP_OPERATOR_FILE: /run/hoptrip/operator.json
    volumes:
      - /etc/hoptrip/operator.json:/run/hoptrip/operator.json:ro
  caddy:
    volumes: !override
      - ./infrastructure/Caddyfile.domain:/etc/caddy/Caddyfile:ro
      - ./infrastructure/Caddyfile.staging:/etc/caddy/Caddyfile.staging:ro
      - caddy_data:/data
      - caddy_config:/config
